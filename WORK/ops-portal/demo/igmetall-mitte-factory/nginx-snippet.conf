# nginx snippet — IG Metall Mitte factory demo (static)
# Add to /etc/nginx/sites-available/mastr-hub (with other /demo/ locations)

location = /demo/igmetall-mitte-factory { return 301 /demo/igmetall-mitte-factory/; }
location /demo/igmetall-mitte-factory/ {
    alias /var/www/mastr-portal/demo/igmetall-mitte-factory/;
    index index.html;
}

# Deploy from Mac:
#   rsync -avz WORK/ops-portal/demo/igmetall-mitte-factory/ ionos-mastr:/var/www/mastr-portal/demo/igmetall-mitte-factory/
#   ssh ionos-mastr 'nginx -t && systemctl reload nginx'
