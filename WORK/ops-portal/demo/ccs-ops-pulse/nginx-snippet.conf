# nginx snippet — CCS Ops Pulse static demo
# Add to /etc/nginx/sites-available/mastr-hub (before Shiny locations or after /portal/)

location = /demo/ccs-ops-pulse { return 301 /demo/ccs-ops-pulse/; }
location /demo/ccs-ops-pulse/ {
    alias /var/www/mastr-portal/demo/ccs-ops-pulse/;
    index index.html;
}

# Deploy from Mac:
#   rsync -avz WORK/ops-portal/demo/ccs-ops-pulse/ ionos-mastr:/var/www/mastr-portal/demo/ccs-ops-pulse/
#   ssh ionos-mastr 'nginx -t && systemctl reload nginx'
