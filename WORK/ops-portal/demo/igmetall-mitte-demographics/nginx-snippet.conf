# nginx snippet — IG Metall Mitte demographics demo (static)
# Add to /etc/nginx/sites-available/mastr-hub (with other /demo/ locations)

location = /demo/igmetall-mitte-demographics { return 301 /demo/igmetall-mitte-demographics/; }
location /demo/igmetall-mitte-demographics/ {
    alias /var/www/mastr-portal/demo/igmetall-mitte-demographics/;
    index index.html;
}

# Deploy from Mac:
#   rsync -avz WORK/ops-portal/demo/igmetall-mitte-demographics/ ionos-mastr:/var/www/mastr-portal/demo/igmetall-mitte-demographics/
#   ssh ionos-mastr 'nginx -t && systemctl reload nginx'
#
# URL:
#   http://82.165.167.86/demo/igmetall-mitte-demographics/
